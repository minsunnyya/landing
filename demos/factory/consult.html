<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기업 행정 상담 | 다올기업행정사</title>
<meta name="description" content="회사명·담당자·사업장 위치로 상담. 데모이며 파일을 서버로 보내지 않습니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="assets/office.css">
</head>
<body>
<a class="skip" href="#f">본문으로</a>
<div class="topbar"><div class="wrap"><span>일반행정사 · 상담</span><span>경기 성남 · <a href="tel:031-000-0000">031-000-0000</a></span></div></div>
<header>
  <div class="wrap nav">
    <a href="index.html" class="brand"><b>다올기업행정사</b><span>CORPORATE ADMINISTRATION</span></a>
    <nav class="nav-links" aria-label="주요 메뉴">
      <a href="find.html">기업 행정 진단</a>
      <a href="about.html">소개</a>
      <a class="nav-consult is-on" href="consult.html">상담</a>
    </nav>
    <button class="burger" id="bb" type="button" aria-label="메뉴 열기" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
  <div class="mpanel" id="mp"><a href="consult.html">상담</a></div>
</header>
<main>
  <section class="contact" id="f">
    <div class="wrap contact-grid">
      <div>
        <h2>기업의 상황을<br>알려 주세요.</h2>
        <p class="lead">평일 하루 안 회신. 허가를 약속하지 않습니다.</p>
        <a class="tel" href="tel:031-000-0000">031-000-0000</a>
        <p>카카오 채널은 개설 후 연결합니다.</p>
      </div>
      <form class="form" id="cf" action="#" method="post">
        <div class="form-grid">
          <div class="field"><label for="co">회사명</label><input id="co" name="company" required placeholder="○○제조"></div>
          <div class="field"><label for="n">담당자</label><input id="n" name="name" required placeholder="홍길동"></div>
        </div>
        <div class="field"><label for="c">연락처</label><input id="c" name="contact" required placeholder="010-0000-0000"></div>
        <p class="step-l">현재 필요한 업무</p>
        <div class="radios">
          <label><input type="radio" name="need" value="new"> 공장설립</label>
          <label><input type="radio" name="need" value="reg"> 공장등록</label>
          <label><input type="radio" name="need" value="permit"> 인허가</label>
          <label><input type="radio" name="need" value="corp"> 기업행정</label>
          <label><input type="radio" name="need" value="appeal"> 행정심판</label>
          <label><input type="radio" name="need" value="etc"> 기타</label>
        </div>
        <div class="form-grid">
          <div class="field">
            <label for="r">사업장 위치</label>
            <select id="r" name="region">
              <option value="">시/군/구 · 권역</option>
              <option>경기</option>
              <option>충남</option>
              <option>충북</option>
              <option>경북</option>
              <option>전남</option>
              <option>그 외</option>
            </select>
          </div>
          <div class="field"><label for="ind">업종</label><input id="ind" name="industry" placeholder="금속가공 등"></div>
        </div>
        <div class="field"><label for="m">현재 상황</label><textarea id="m" name="message" rows="4" placeholder="사업 단계, 면적 감각"></textarea></div>
        <div class="field"><label for="file">관련 자료</label><input id="file" type="file"><p class="demo" style="margin:6px 0 0;color:var(--muted)">데모입니다. 제출 시 파일은 비웁니다. 올리지 마십시오.</p></div>
        <label class="consent"><input type="checkbox" required><span>상담을 위해 회사명·연락처 수집에 동의합니다. <a href="privacy.html" style="color:var(--blue);font-weight:700">개인정보처리방침</a></span></label>
        <button class="btn btn-navy submit" type="submit">상담 신청</button>
        <p class="form-msg">데모입니다. 서버로 전송하지 않습니다.</p>
      </form>
    </div>
  </section>
</main>
<footer><div class="wrap"><div class="foot-name">다올기업행정사</div><p>카카오 채널은 개설 후 연결합니다.</p></div></footer>
<div class="sticky"><a class="talk" href="consult.html">상담</a><a class="tel" href="tel:031-000-0000">전화상담</a></div>
<script src="assets/office.js"></script>
</body>
</html>
