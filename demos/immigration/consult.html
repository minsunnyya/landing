<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상담 | 한빛출입국행정사</title>
<meta name="description" content="누구의 비자인지부터. 무료 상담이라고 쓰지 않습니다. 허가를 보장하지 않습니다.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="assets/office.css">
</head>
<body>
<a class="skip" href="#contact">본문으로</a>
<div class="topbar"><div class="wrap"><span>서울 구로 · <a href="tel:02-000-0000">02-000-0000</a></span></div></div>
<header>
  <div class="wrap nav">
    <a href="index.html" class="brand"><b>한빛출입국행정사</b><span>비자부터 체류까지</span></a>
    <nav class="nav-links">
      <a href="find.html">비자 찾기</a>
      <a href="visas.html">비자·체류</a>
      <a href="corporate.html">기업 출입국</a>
      <button class="icon-btn" id="searchOpen" type="button" aria-label="검색">⌕</button>
      <a class="nav-consult is-on" href="consult.html">상담하기</a>
    </nav>
    <button class="burger" id="bb" type="button" aria-label="메뉴"><span></span><span></span><span></span></button>
  </div>
  <div class="mpanel" id="mp"><a href="consult.html">상담</a><a href="tel:02-000-0000">전화</a></div>
</header>
<div class="search-scrim" id="searchScrim"><div class="search-box"><label class="field" for="searchInput">검색</label><input id="searchInput" type="search"><div class="search-hits" id="searchHits"></div></div></div>
<main>
  <section class="contact" id="contact">
    <div class="wrap contact-grid">
      <div>
        <h2>현재 상황을 알려 주세요.</h2>
        <p class="lead">자동 비자 판정이 아닙니다. 카카오 채널은 개설 후 연결합니다.</p>
        <a class="tel" href="tel:02-000-0000">02-000-0000</a>
        <p class="hours" style="color:#9eb8ce;margin-top:8px">평일 09:00–18:00 · 한국어 상담, 통역은 별도</p>
      </div>
      <form class="form" id="cf" action="#" method="post">
        <p class="step-l">누구의 비자를 준비하고 계신가요?</p>
        <div class="radios">
          <label><input type="radio" name="who" value="본인"> 제 비자</label>
          <label><input type="radio" name="who" value="가족"> 배우자/가족</label>
          <label><input type="radio" name="who" value="기업"> 외국인 직원</label>
          <label><input type="radio" name="who" value="초청"> 초청인</label>
          <label><input type="radio" name="who" value="기타"> 기타</label>
        </div>
        <div id="firmBlock" class="firm">
          <p class="step-l">기업</p>
          <div class="form-grid">
            <div class="field"><label for="co">회사명</label><input id="co" name="company"></div>
            <div class="field"><label for="pic">담당자</label><input id="pic" name="pic"></div>
          </div>
          <div class="form-grid">
            <div class="field"><label for="head">채용 예정 인원</label><input id="head" name="headcount"></div>
            <div class="field"><label for="job">채용 직무</label><input id="job" name="job"></div>
          </div>
          <div class="field"><label for="hire">고용 형태</label><input id="hire" name="hire" placeholder="정규 · 계약 등"></div>
        </div>
        <p class="step-l">현재 어디에 있나요?</p>
        <div class="radios">
          <label><input type="radio" name="place" value="한국"> 한국</label>
          <label><input type="radio" name="place" value="해외"> 해외</label>
        </div>
        <p class="step-l">현재 체류자격</p>
        <div class="radios">
          <label><input type="radio" name="need" value="D-2"> D-2</label>
          <label><input type="radio" name="need" value="D-4"> D-4</label>
          <label><input type="radio" name="need" value="E-7"> E-7</label>
          <label><input type="radio" name="need" value="F-4"> F-4</label>
          <label><input type="radio" name="need" value="F-6"> F-6</label>
          <label><input type="radio" name="need" value="없음"> 없음</label>
          <label><input type="radio" name="need" value="모름"> 모름</label>
          <label><input type="radio" name="need" value="기타"> 기타</label>
        </div>
        <p class="step-l">원하는 목적</p>
        <div class="field">
          <label for="purpose">목적</label>
          <select id="purpose" name="purpose">
            <option value="">선택</option>
            <option>취업</option><option>유학</option><option>결혼</option>
            <option>연장</option><option>자격변경</option><option>영주</option>
            <option>국적</option><option>초청</option><option>기타</option>
          </select>
        </div>
        <div class="field"><label for="nat">국적</label><input id="nat" name="nationality"></div>
        <div class="field"><label for="m">상세 상황</label><textarea id="m" name="message" rows="4" placeholder="학력·경력·만료일 등"></textarea></div>
        <div class="field">
          <label for="files">서류 첨부. 주민등록번호 등 민감정보는 넣지 말아 주세요. 파일명만 이 브라우저에 표시됩니다.</label>
          <input id="files" name="files" type="file" multiple accept=".pdf,.jpg,.jpeg,.png" data-files="fileOut">
          <p id="fileOut" style="font-size:13px;color:var(--muted);margin-top:6px"></p>
        </div>
        <div class="form-grid">
          <div class="field"><label for="n">이름</label><input id="n" name="name" required autocomplete="name"></div>
          <div class="field"><label for="c">연락처</label><input id="c" name="contact" required autocomplete="tel"></div>
        </div>
        <div class="field"><label for="e">이메일</label><input id="e" name="email" type="email" autocomplete="email"></div>
        <label class="consent">
          <input type="checkbox" required>
          <span>상담을 위해 이름·연락처·요지 수집에 동의합니다. <a href="privacy.html" style="color:var(--teal);font-weight:700">개인정보처리방침</a></span>
        </label>
        <button class="btn btn-navy submit" type="submit">상담 신청</button>
        <p class="form-msg">이 데모는 전송하지 않습니다. 관리자 CMS는 없습니다.</p>
      </form>
    </div>
  </section>
</main>
<footer>
  <div class="wrap"><div class="foot-name">한빛출입국행정사</div><p>카카오 채널은 개설 후</p></div>
</footer>
<div class="sticky"><a class="talk" href="consult.html">상담</a><a class="tel" href="tel:02-000-0000">전화</a></div>
<script src="assets/office.js"></script>
</body>
</html>
